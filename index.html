<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HD Premium Video Player</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Adsgram SDK -->
    <script id="adsgram-script" src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #121824;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #1e293b;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0088cc, #005588);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .icon-box svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-ad {
            background: linear-gradient(135deg, #0088cc, #006699);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-ad:active {
            transform: scale(0.98);
        }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            display: none;
            padding: 10px;
            border-radius: 8px;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </div>
        
        <h2>Movie Prime</h2>
        <p>Watch a short video ad to claim your reward or unlock premium content.</p>

        <button class="btn-ad" onclick="showRewardAd()">
            ⚡ TEST AD LOAD
        </button>

        <div id="statusBox" class="status-msg"></div>
    </div>

    <script>
        // Telegram Web App Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Adsgram Controller Setup (Active Block ID: 42965)
        const AdController = window.Adsgram.init({ 
            blockId: "42965" 
        });

        function showRewardAd() {
            const statusBox = document.getElementById("statusBox");
            statusBox.style.display = "none";

            AdController.show().then((result) => {
                // Ad successfully watched
                statusBox.className = "status-msg status-success";
                statusBox.innerText = "Ad watched successfully! Reward unlocked.";
                statusBox.style.display = "block";
            }).catch((result) => {
                // Ad error or closed early
                statusBox.className = "status-msg status-error";
                statusBox.innerText = "Ad failed or closed early. Please try again.";
                statusBox.style.display = "block";
                console.log("Adsgram Error/Event:", result);
            });
        }
    </script>

</body>
</html>

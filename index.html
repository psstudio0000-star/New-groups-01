<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Movie Prime - Premium Collection</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 24px;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: #94a3b8;
    }

    /* Join Group Button Box */
    .group-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .join-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .join-btn:active {
      transform: scale(0.98);
    }

    /* Ads Section */
    .ad-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .ad-card h3 {
      font-size: 16px;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .action-btn {
      width: 100%;
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:active {
      background: #0369a1;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      color: #cbd5e1;
      min-height: 18px;
    }

    .footer {
      margin-top: auto;
      font-size: 12px;
      color: #64748b;
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Movie Prime</h1>
      <p>Watch Ads & Get Instant Group Links</p>
    </div>

    <!-- Group Join Section -->
    <div class="group-card">
      <a href="https://t.me/+tBz1Jj29kYhmZjY5" target="_blank" class="join-btn">
        🔥 JOIN THIS AMAZING GROUP 🥵
      </a>
    </div>

    <!-- Ad Block 1 -->
    <div class="ad-card">
      <h3>Unlock Server 1 Link</h3>
      <button class="action-btn" onclick="showAd('1')">Watch Ad to Unlock</button>
      <div id="status-1" class="status-msg"></div>
    </div>

    <!-- Ad Block 2 -->
    <div class="ad-card">
      <h3>Unlock Server 2 Link</h3>
      <button class="action-btn" onclick="showAd('2')">Watch Ad to Unlock</button>
      <div id="status-2" class="status-msg"></div>
    </div>

    <div class="footer">
      Powered by Adsgram Monetization Platform
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Configuration - Updated Adsgram Block IDs
    const CONFIG = {
      BLOCK_ID_1: "43334", // Nayi Block ID set kar di gayi hai
      BLOCK_ID_2: "43334"  // Agli ID alag ho toh yahan update kar sakte hain
    };

    // Show Ad Function
    function showAd(blockNum) {
      const blockId = blockNum === '1' ? CONFIG.BLOCK_ID_1 : CONFIG.BLOCK_ID_2;
      const statusElement = document.getElementById(`status-${blockNum}`);

      if (!blockId) {
        statusElement.style.color = "#ef4444";
        statusElement.innerText = "Error: Block ID available nahi hai!";
        return;
      }

      statusElement.style.color = "#cbd5e1";
      statusElement.innerText = "Ad Loading...";

      // Adsgram Controller Init
      const AdController = window.Adsgram.init({ blockId: blockId });

      AdController.show().then((result) => {
        // Ad Success Callback
        statusElement.style.color = "#22c55e";
        statusElement.innerText = "✅ Reward Unlocked! Group link activated.";
      }).catch((result) => {
        // Ad Error/Cancel Callback
        statusElement.style.color = "#ef4444";
        statusElement.innerText = "❌ Ad complete nahi hua. Dobara try karein.";
      });
    }
  </script>

</body>
</html>
